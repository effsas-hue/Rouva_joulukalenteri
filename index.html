<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rouvan BDSM-joulukalenteri 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0a0f; color: #e8d5c4; font-family: 'Cormorant Garamond', serif; min-height: 100vh; padding: 20px; }
header { text-align: center; padding: 40px 20px; border-bottom: 2px solid #8b0000; }
h1 { font-family: 'Playfair Display', serif; font-size: 2.8em; color: #c9a87c; margin-bottom: 10px; }
.subtitle { font-style: italic; font-size: 1.3em; color: #a89080; }
.calendar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 1100px; margin: 40px auto; padding: 20px; }
.door { background: linear-gradient(145deg, #1a1218, #0f0a0d); border: 2px solid #5a2030; border-radius: 8px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 2em; font-weight: bold; color: #c9a87c; cursor: pointer; transition: all 0.3s; }
.door:hover { transform: scale(1.05); border-color: #8b0000; box-shadow: 0 0 20px rgba(139,0,0,0.4); }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 100; align-items: center; justify-content: center; }
.modal-content { background: #140e12; border: 2px solid #8b0000; border-radius: 12px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 30px; color: #e8d5c4; }
.modal h2 { font-family: 'Playfair Display', serif; color: #c9a87c; margin-bottom: 15px; }
.close { float: right; font-size: 2em; cursor: pointer; color: #c9a87c; }
footer { text-align: center; padding: 30px; font-size: 0.9em; color: #6a5048; }
</style>
</head>
<body>
<header>
  <h1>Rouvan Joulukalenteri</h1>
  <p class="subtitle">Orjan 24 päivän antautuminen</p>
</header>
<div class="calendar" id="calendar"></div>
<footer>Rouvan orjalle • 2026</footer>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const days = [
  { day: 1, title: "1. Luukku – Polvistuminen", content: "Rouva odottaa. Polvistu ja odota hänen katsettaan. Tänään alkaa antautuminen." },
  { day: 2, title: "2. Luukku – Kaulapanta", content: "Rouva kiinnittää kaulapannan. Orja kuuluu hänelle. Pidä se koko päivän." },
  { day: 3, title: "3. Luukku – Shibari", content: "Rouva sitoo orjan. Köydet kiristyvät. Hengitä ja antaudu." },
  { day: 4, title: "4. Luukku – Siveysvyö", content: "Rouva lukitsee siveysvyön. Orjan nautinto on hänen hallussaan." },
  { day: 5, title: "5. Luukku – Sähkö", content: "Rouva ottaa sähkölelut esiin. Pieni kipu, suuri kontrolli." },
  { day: 6, title: "6. Luukku – Palvelus", content: "Orja palvelee. Rouva nauttii. Orjan tehtävä on miellyttää." },
  { day: 7, title: "7. Luukku – Ruoska", content: "Rouva käyttää ruoskaa. Orja laskee iskut ääneen." },
  { day: 8, title: "8. Luukku – Lateksi", content: "Rouva pukeutuu lateksiin. Orja ihailee ja palvelee." },
  { day: 9, title: "9. Luukku – Pegging", content: "Rouva ottaa kontrollin. Orja antautuu kokonaan." },
  { day: 10, title: "10. Luukku – Hiljaisuus", content: "Orja ei puhu. Rouva puhuu. Kuuntele." },
  { day: 11, title: "11. Luukku – Shibari 2", content: "Monimutkaisempi sidonta. Orja on koriste." },
  { day: 12, title: "12. Luukku – Siveys", content: "Siveysvyö pysyy. Rouva päättää milloin se avataan." },
  { day: 13, title: "13. Luukku – Kipu", content: "Rouva antaa kipua. Orja kiittää." },
  { day: 14, title: "14. Luukku – Palvonta", content: "Orja palvoo Rouvan jalkoja. Kiitollisuus." },
  { day: 15, title: "15. Luukku – Sähkö 2", content: "Vahvempi sähkö. Orja kestää Rouvan puolesta." },
  { day: 16, title: "16. Luukku – Sidonta", content: "Orja on sidottu pitkään. Rouva katsoo." },
  { day: 17, title: "17. Luukku – Käsky", content: "Rouva antaa käskyn. Orja tottelee välittömästi." },
  { day: 18, title: "18. Luukku – Nöyryytys", content: "Rouva nöyryyttää. Orja hyväksyy." },
  { day: 19, title: "19. Luukku – Kestävyys", content: "Pitkä sessio. Orja kestää Rouvan iloksi." },
  { day: 20, title: "20. Luukku – Lahja", content: "Orja on lahja Rouvalle. Käytä häntä." },
  { day: 21, title: "21. Luukku – Shibari 3", content: "Kaunein sidonta. Orja on taideteos." },
  { day: 22, title: "22. Luukku – Siveys 2", content: "Viimeiset päivät siveydessä. Rouva päättää." },
  { day: 23, title: "23. Luukku – Odotus", content: "Huomenna on jouluaatto. Orja odottaa Rouvan tahtoa." },
  { day: 24, title: "24. Luukku – Antautuminen", content: "Jouluaatto. Orja antautuu kokonaan Rouvalle. Hän omistaa sinut." }
];
const calendar = document.getElementById('calendar');
days.forEach(d => {
  const door = document.createElement('div');
  door.className = 'door';
  door.textContent = d.day;
  door.onclick = () => openDoor(d);
  calendar.appendChild(door);
});
function openDoor(d) {
  document.getElementById('modal-title').textContent = d.title;
  document.getElementById('modal-body').innerHTML = '<p>' + d.content + '</p>';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
window.onclick = (e) => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
